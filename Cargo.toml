[package]
name = "wallapop-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Small, bounded Wallapop MCP server and CLI in one executable"
license = "MIT"
repository = "https://github.com/jrrome/wallapop-mcp"

[dependencies]
base64 = "0.23"
getrandom = "0.2"
hmac = "0.12"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.5"
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tempfile = "3"
ureq = { version = "3.5", default-features = false, features = ["native-tls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
