events {}
http {
    server {
        listen 8080;

        location / {
            if ($http_authorization != "Bearer PLACEHOLDER") {
                return 401 '{"error":"unauthorized"}\n';
            }
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
