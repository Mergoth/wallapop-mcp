services:
  wallapop-mcp:
    container_name: wallapop-mcp
    build:
      context: .
      args:
        UID: ${APP_UID:-1026}
        GID: ${APP_GID:-100}
    image: wallapop-mcp:latest
    networks:
      - mcp-net
    environment:
      - GATEWAY_REGISTRATION_TOKEN=${GATEWAY_REGISTRATION_TOKEN:?Set GATEWAY_REGISTRATION_TOKEN}
      - WALLAPOP_UPSTREAM_TOKEN=${WALLAPOP_UPSTREAM_TOKEN:?Set WALLAPOP_UPSTREAM_TOKEN}
      - GATEWAY_INTERNAL_URL=${GATEWAY_INTERNAL_URL:-http://mcp-gateway:8081}
      - WALLAPOP_MCP_ARGS=--allow-writes
      - UPLOAD_SECRET=${UPLOAD_SECRET:?Set UPLOAD_SECRET (signs photo upload tickets)}
      - UPLOAD_DIR=${UPLOAD_DIR:-/data/uploads}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://mcp.mergoth.synology.me/wallapop}
      - UPLOAD_TTL_SECONDS=${UPLOAD_TTL_SECONDS:-600}
      - PHOTO_URL_HOSTS=${PHOTO_URL_HOSTS:-}
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  mcp-net:
    external: true
