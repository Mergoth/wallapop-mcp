services:
  wallapop-mcp:
    build:
      context: .
      args:
        UID: ${APP_UID:-1026}
        GID: ${APP_GID:-100}
    image: wallapop-mcp:latest
    ports:
      # Loopback only: the DSM reverse proxy is the only thing that should reach it.
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_RESOURCE_URL=${MCP_RESOURCE_URL:?Set MCP_RESOURCE_URL to the public MCP URL, /mcp included}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}
      - MCP_OWNER_EMAIL=${MCP_OWNER_EMAIL:?Set MCP_OWNER_EMAIL to the one Google account allowed in}
      # Optional static bearer for header-capable clients (Claude Code). Empty = OAuth only.
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
    volumes:
      - ./data:/data
      # OAuth clients and token digests.
      - ./state:/state
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
