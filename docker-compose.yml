services:
  mcp:
    build: .
    image: wallapop-mcp:latest
    # Internal only — nginx handles the auth'd external port
    expose:
      - "8081"
    command: ["supergateway", "--port", "8081", "--stdio", "wallapop-mcp"]
    volumes:
      - ./data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf.tmpl:ro
    environment:
      - MCP_AUTH_TOKEN
    depends_on:
      - mcp
    restart: unless-stopped
    # envsubst replaces PLACEHOLDER in the template with the actual token at startup
    command: >
      sh -c "sed s/PLACEHOLDER/$${MCP_AUTH_TOKEN}/g /etc/nginx/nginx.conf.tmpl
             > /etc/nginx/nginx.conf
             && nginx -g 'daemon off;'"
