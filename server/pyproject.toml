[project]
name = "wallapop-server"
version = "0.1.0"
description = "Streamable HTTP server for wallapop-mcp behind the NAS gateway"
requires-python = ">=3.12"
dependencies = [
    "mcp-gateway",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv.sources]
mcp-gateway = { path = "vendor/mcp_gateway-0.1.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallapop_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
