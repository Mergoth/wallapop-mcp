[project]
name = "wallapop-gateway"
version = "0.1.0"
description = "OAuth-protected Streamable HTTP gateway in front of the wallapop-mcp stdio server"
requires-python = ">=3.12"
dependencies = ["mcp==2.0.0", "uvicorn"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallapop_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
